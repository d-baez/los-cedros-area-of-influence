<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <!-- ==========================================================
             STORY LAYOUT + NARRATIVE STYLES (added for scrollytelling)
             ========================================================== -->
        <style>
            :root{
                --ink:#1b2420;
                --paper:#f6f4ee;
                --line:#d8d2c2;
                --accent:#3c6e47;
            }
            * { box-sizing: border-box; }

            html, body {
                margin: 0;
                padding: 0;
                font-family: "Iowan Old Style","Georgia",serif;
                color: var(--ink);
            }

            header.masthead {
                position: relative;
                padding: 3rem 6vw 2rem;
                background: var(--paper);
                border-bottom: 1px solid var(--line);
            }
            header.masthead .eyebrow {
                font-family: "Helvetica Neue", Arial, sans-serif;
                text-transform: uppercase;
                letter-spacing: 0.14em;
                font-size: 1.5rem;
                color: var(--accent);
                margin: 0 0 0.6rem;
            }
            header.masthead h1 {
                font-size: clamp(1.8rem, 4vw, 3rem);
                line-height: 1.05;
                margin: 0 0 0.6rem;
                max-width: 22ch;
            }
            header.masthead p.dek {
                font-family: "Helvetica Neue", Arial, sans-serif;
                font-size: 1rem;
                color: #4a534c;
                max-width: 58ch;
                line-height: 1.5;
            }

            .lang-toggle {
                position: absolute;
                top: 3rem;
                right: 6vw;
                display: inline-flex;
                font-family: "Helvetica Neue", Arial, sans-serif;
                font-size: 0.75rem;
                border: 1px solid var(--line);
                border-radius: 999px;
                overflow: hidden;
                background: #fff;
            }
            .lang-toggle button {
                appearance: none;
                border: none;
                background: transparent;
                color: var(--ink);
                padding: 0.4rem 0.8rem;
                cursor: pointer;
                font: inherit;
                letter-spacing: 0.04em;
            }
            .lang-toggle button.is-active {
                background: var(--accent);
                color: #fff;
            }
            .lang-toggle button:not(.is-active):hover {
                background: var(--paper);
            }
            @media (max-width: 820px) {
                .lang-toggle { position: static; margin-top: 1rem; }
            }

            .story {
                position: relative;
                display: flex;
            }

            .map-pane {
                position: sticky;
                top: 0;
                width: 62%;
                height: 100vh;
            }

            .text-pane {
                width: 38%;
                padding: 0 4vw;
                background: var(--paper);
            }

            .section {
                min-height: 92vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 3rem 0;
                border-bottom: 1px solid var(--line);
                opacity: 0.45;
                transition: opacity 0.4s ease;
            }
            .section:last-child { border-bottom: none; }
            .section.is-active { opacity: 1; }

            .section .step-label {
                font-family: "Helvetica Neue", Arial, sans-serif;
                text-transform: uppercase;
                letter-spacing: 0.12em;
                font-size: 0.68rem;
                color: var(--accent);
                margin-bottom: 0.6rem;
            }
            .section h2 {
                font-size: 1.5rem;
                line-height: 1.2;
                margin: 0 0 0.9rem;
            }
            .section p {
                font-family: "Helvetica Neue", Arial, sans-serif;
                font-size: 0.98rem;
                line-height: 1.65;
                color: #333c35;
            }


            .story-photo {
                margin: 1.5rem 0 0;
            }

            .story-photo img {
                display: block;
                width: 100%;
                height: auto;
                border-radius: 2px;
            }

            .story-photo figcaption {
                font-family: "Helvetica Neue", Arial, sans-serif;
                font-size: 0.75rem;
                line-height: 1.4;
                color: #667067;
                margin-top: 0.45rem;
            }

            @media (max-width: 820px) {
                .story { flex-direction: column; }
                .map-pane { position: relative; width: 100%; height: 55vh; }
                .text-pane { width: 100%; padding: 0 6vw; }
            }
        </style>
        <!-- ========================================================== -->

        <title>Los Cedros — Area of Influence</title>
    </head>
    <body>

        <!-- ==================================================
             NARRATIVE HEADER
             Text is filled in by script (renderStaticText() below) from
             data/i18n.js's `translations`, so it switches with the EN/ES
             toggle. Edit translations.en / translations.es there, not the
             text here.
             ================================================== -->
        <header class="masthead">
            <div class="lang-toggle" role="group" aria-label="Language / Idioma">
                <button type="button" id="lang-en" data-lang="en">EN</button>
                <button type="button" id="lang-es" data-lang="es">ES</button>
            </div>
            <p class="eyebrow" id="masthead-eyebrow"></p>
            <h1 id="masthead-title"></h1>
            <p class="dek" id="masthead-dek"></p>
        </header>

        <div class="story">

            <div class="map-pane">
                <div id="map">
                    <div id="popup" class="ol-popup">
                        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                        <div id="popup-content"></div>
                    </div>
                </div>
            </div>

            <!-- ==================================================
                 NARRATIVE SECTIONS — edit text; add/remove sections
                 as needed. data-step must match the WAYPOINTS array
                 in the script at the bottom of this file.
                 ================================================== -->
            <div class="text-pane">

                <!-- ==================================================
                     OVERVIEW SECTION — text is filled in by script from
                     data/i18n.js's `translations` (overviewStepLabel/
                     overviewHeading/overviewBody), so it switches with
                     the EN/ES toggle. Edit translations there, not here.
                     ================================================== -->
                <section class="section" data-step="0">
                    <p class="step-label" id="overview-step-label"></p>
                    <h2 id="overview-heading"></h2>
                    <p id="overview-body"></p>

                    <!-- Optional future photo:
                    <figure class="story-photo">
                        <img src="images/overview.jpg" alt="Description of overview photograph">
                        <figcaption>Photo caption goes here.</figcaption>
                    </figure>
                    -->
                </section>

                <!-- ==================================================
                     RESERVE BOUNDARY SECTION — description is filled in
                     from data/boundary.js (bilingual, via pickLang()),
                     and the step-label/heading from data/i18n.js's
                     `translations`, at load time (see script below).
                     Edit those files, not the text here, so the map
                     outline and this narrative copy stay in sync and
                     switch with the EN/ES toggle. The photo is still
                     edited by hand.
                     ================================================== -->
                <section class="section" data-step="1">
                    <p class="step-label" id="boundary-step-label"></p>
                    <h2 id="boundary-heading"></h2>
                    <p id="boundary-description"></p>

                    <!-- Optional future photo:
                    <figure class="story-photo">
                        <img src="images/reserve-boundary.jpg" alt="Description of reserve boundary photograph">
                        <figcaption>Photo caption goes here.</figcaption>
                    </figure>
                    -->
                </section>

                <!-- ==================================================
                     SCIENTIFIC STATION SECTION — name and description are
                     filled in from data/station.js (description is
                     bilingual, via pickLang()) at load time, and the
                     step-label from data/i18n.js's `translations` (see
                     script below). Edit those files, not the text here,
                     so the map pin, the waypoint the map flies to, and
                     this narrative copy all stay in sync and switch with
                     the EN/ES toggle. The photo is still edited by hand.
                     ================================================== -->
                <section class="section" data-step="2">
                    <p class="step-label" id="station-step-label"></p>
                    <h2 id="station-heading"></h2>
                    <p id="station-description"></p>

                    <!-- Optional future photo:
                    <figure class="story-photo">
                        <img src="images/scientific-station.jpg" alt="Description of scientific station photograph">
                        <figcaption>Photo caption goes here.</figcaption>
                    </figure>
                    -->
                </section>

                <!-- ==================================================
                     COMMUNITY SECTIONS — generated from data/communities.js
                     at load time (see script below). Do not add
                     community sections here by hand; edit
                     data/communities.js instead so the map pins, the
                     WAYPOINTS the map flies to, and this narrative copy
                     all stay in sync. Communities with coordinates: null
                     are skipped until real coordinates are added.
                     ================================================== -->
                <div id="community-sections"></div>

            </div>
        </div>

        <script src="data/i18n.js"></script>
        <script src="data/boundary.js"></script>
        <script src="data/station.js"></script>
        <script src="data/communities.js"></script>
        <script src="resources/geojson-layer-helpers.js"></script>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/LosCedros_BoundaryLos_Cedros_boundary_1.js"></script><script src="layers/Scientific_station_SHPScientificStationLocation_2.js"></script><script src="layers/Example_communities_3.js"></script>
        <script src="styles/LosCedros_BoundaryLos_Cedros_boundary_1_style.js"></script><script src="styles/Scientific_station_SHPScientificStationLocation_2_style.js"></script><script src="styles/Example_communities_3_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script>
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>

        <!-- ==================================================
             LEGEND / LAYER SWITCHER
             ol-layerswitcher.js + .css were already being loaded but the
             control itself was never instantiated, so the map had no
             visible legend even though each layer already carries its
             swatch image (styles/legend/*.png) via its `title`. This adds
             the "Legend" toggle button (top-right of the map) that lists
             each layer with its swatch and a visibility checkbox.
             ================================================== -->
        <script>
            var layerSwitcher = new LayerSwitcher({
                tipLabel: translations[CURRENT_LANG].legend,
                groupSelectStyle: 'group'
            });
            map.addControl(layerSwitcher);
        </script>

        <!-- ==================================================
             SCROLL-TRIGGERED MAP MOVEMENT
             This runs AFTER qgis2web.js above, so the global
             `map` variable already exists at this point.
             Edit WAYPOINTS with real coordinates/zoom levels
             for each section once you know them (see notes below).
             ================================================== -->
        <script>
            // Fixed waypoint for the 1 section with no dedicated data file
            // yet (overview). Coordinates below are converted from the
            // QGIS Web Mercator layer coordinates (EPSG:3857) into
            // longitude/latitude for OpenLayers. To create or refine a
            // waypoint manually, open the map, zoom/pan to the spot you
            // want, open the browser console, and run:
            //   console.log(ol.proj.toLonLat(map.getView().getCenter()), map.getView().getZoom())
            // then copy the resulting [lon, lat] and zoom back in here.
            // Waypoints (where the map flies to) don't depend on language,
            // so they're computed once here, not inside setLanguage()/
            // renderStaticText() below.
            var FIXED_WAYPOINTS = [
                { center: [-78.807469, 0.336393], zoom: 12, duration: 1200 }, // 0 — overview / reserve area
                { center: [-78.807469, 0.336393], zoom: 14, duration: 1200 }  // 1 — reserve boundary
            ];
            FIXED_WAYPOINTS.push({ center: station.coordinates, zoom: station.zoom, duration: station.duration }); // 2 — scientific station

            // Community waypoints (step 3 onward) are generated from
            // data/communities.js so they never drift out of sync with the
            // community map pins in layers/Example_communities_3.js.
            // Communities with coordinates: null are skipped — they get
            // neither a map pin nor a waypoint until real coordinates are
            // added to data/communities.js.
            var communitiesWithLocation = communities.filter(function (c) {
                return Array.isArray(c.coordinates);
            });

            var skippedCommunities = communities.filter(function (c) {
                return !Array.isArray(c.coordinates);
            });
            if (skippedCommunities.length) {
                console.warn(
                    'Skipping ' + skippedCommunities.length + ' communit' +
                    (skippedCommunities.length === 1 ? 'y' : 'ies') +
                    ' with no coordinates yet (see data/communities.js): ' +
                    skippedCommunities.map(function (c) { return c.name; }).join(', ')
                );
            }

            var COMMUNITY_STEP_OFFSET = FIXED_WAYPOINTS.length;

            var WAYPOINTS = FIXED_WAYPOINTS.concat(
                communitiesWithLocation.map(function (c) {
                    return { center: c.coordinates, zoom: c.zoom, duration: c.duration };
                })
            );

            // ==================================================
            // LANGUAGE (EN/ES) RENDERING
            // Everything text-dependent-on-language is rendered by the
            // functions below, called once at startup and again whenever
            // setLanguage() runs (from the EN/ES toggle buttons in the
            // header). Community <section> DOM nodes are only ever built
            // ONCE (further down) — toggling just updates their text in
            // place, so scroll position and the IntersectionObserver
            // below are undisturbed by a language switch.
            // ==================================================

            // Masthead + the 3 fixed/semi-fixed sections (overview,
            // boundary, station). Names (station.name, community c.name)
            // are NOT translated — only shortDescription/description are
            // bilingual. Edit copy in data/i18n.js's `translations` or in
            // data/boundary.js / data/station.js, not here.
            function renderStaticText() {
                var t = translations[CURRENT_LANG];

                document.getElementById('masthead-eyebrow').textContent = t.eyebrow;
                document.getElementById('masthead-title').textContent = t.title;
                document.getElementById('masthead-dek').textContent = t.dek;

                document.getElementById('overview-step-label').textContent = t.overviewStepLabel;
                document.getElementById('overview-heading').textContent = t.overviewHeading;
                document.getElementById('overview-body').textContent = t.overviewBody;

                document.getElementById('boundary-step-label').textContent = t.boundaryStepLabel;
                document.getElementById('boundary-heading').textContent = t.boundaryHeading;
                document.getElementById('boundary-description').textContent = pickLang(boundary.description);

                document.getElementById('station-step-label').textContent = t.stationStepLabel;
                document.getElementById('station-heading').textContent = station.name;
                document.getElementById('station-description').textContent = pickLang(station.description);
            }

            // Updates just the description <p> in each already-built
            // community section (see the one-time build below) — doesn't
            // touch the step-label/heading (community names aren't
            // translated) or recreate any DOM nodes.
            function renderCommunityText() {
                communitiesWithLocation.forEach(function (c) {
                    var el = document.getElementById('community-description-' + c.id);
                    if (el) el.textContent = pickLang(c.description);
                });
            }

            // Keeps the map's click-popup content in the current language.
            // The vector sources (jsonSource_*) come from layers/layers.js,
            // loaded earlier on this page. Matches communities by their
            // `id` GeoJSON property back to data/communities.js.
            function updateFeaturePopups() {
                jsonSource_LosCedros_BoundaryLos_Cedros_boundary_1.getFeatures().forEach(function (f) {
                    f.set('description', pickLang(boundary.shortDescription) || pickLang(boundary.description) || null);
                });
                jsonSource_Scientific_station_SHPScientificStationLocation_2.getFeatures().forEach(function (f) {
                    f.set('description', pickLang(station.shortDescription) || pickLang(station.description) || null);
                });
                jsonSource_Example_communities_3.getFeatures().forEach(function (f) {
                    var c = communitiesWithLocation.find(function (c) { return String(c.id) === String(f.get('id')); });
                    if (c) f.set('description', pickLang(c.shortDescription) || pickLang(c.description) || null);
                });
            }

            // Legend button's tooltip ("Legend"/"Leyenda"). layerSwitcher
            // is created earlier on this page; its label list of layer
            // names isn't translated (out of scope — those are set once,
            // per-layer, in layers/layers.js).
            function updateLegendLabel() {
                var label = translations[CURRENT_LANG].legend;
                layerSwitcher.tipLabel = label;
                layerSwitcher.button.setAttribute('title', label);
                layerSwitcher.button.setAttribute('aria-label', label);
            }

            function updateLangToggleButtons() {
                document.getElementById('lang-en').classList.toggle('is-active', CURRENT_LANG === 'en');
                document.getElementById('lang-es').classList.toggle('is-active', CURRENT_LANG === 'es');
            }

            function setLanguage(lang) {
                if (lang !== 'en' && lang !== 'es') return;
                CURRENT_LANG = lang;
                try { localStorage.setItem('lang', lang); } catch (e) { /* private mode, etc. — ignore */ }
                document.documentElement.lang = CURRENT_LANG;
                renderStaticText();
                renderCommunityText();
                updateFeaturePopups();
                updateLegendLabel();
                updateLangToggleButtons();
            }

            document.getElementById('lang-en').addEventListener('click', function () { setLanguage('en'); });
            document.getElementById('lang-es').addEventListener('click', function () { setLanguage('es'); });

            // Build the narrative <section> for each located community and
            // append it to the text pane, continuing the data-step numbering
            // right after the fixed sections above. Built ONCE — see
            // renderCommunityText() above for how the description text
            // inside stays in sync with the language toggle afterwards.
            var communitySectionsContainer = document.getElementById('community-sections');
            communitiesWithLocation.forEach(function (c, i) {
                var step = COMMUNITY_STEP_OFFSET + i;
                var section = document.createElement('section');
                section.className = 'section';
                section.dataset.step = String(step);
                section.innerHTML =
                    '<p class="step-label">' + String(step + 1).padStart(2, '0') + ' — ' + c.name + '</p>' +
                    '<h2>' + c.name + '</h2>' +
                    '<p id="community-description-' + c.id + '"></p>' +
                    '<!-- Optional future photo:\n' +
                    '<figure class="story-photo">\n' +
                    '    <img src="images/community-' + c.id + '.jpg" alt="Description of ' + c.name + ' photograph">\n' +
                    '    <figcaption>Photo caption goes here.</figcaption>\n' +
                    '</figure>\n' +
                    '-->';
                communitySectionsContainer.appendChild(section);
            });

            // Initial render in the starting language (see
            // data/i18n.js's detectLanguage() for how CURRENT_LANG is
            // chosen: remembered choice > browser language > English).
            renderStaticText();
            renderCommunityText();
            updateFeaturePopups();
            updateLegendLabel();
            updateLangToggleButtons();

            // Animates the map to a single waypoint (see FIXED_WAYPOINTS/
            // WAYPOINTS above, ~line 368, for the [lon, lat]/zoom/duration
            // shape and how to capture new ones from the console).
            // Called automatically by the IntersectionObserver below as the
            // reader scrolls — you normally don't need to call this
            // directly. `waypoint.duration` is in milliseconds and controls
            // how long the pan/zoom animation takes.
            // To change WHERE the map flies for a given section, edit that
            // section's entry in WAYPOINTS/FIXED_WAYPOINTS instead of this
            // function. To change HOW it flies (e.g. add rotation, use
            // map.getView().fit(), swap animate() for a different easing),
            // edit the options object passed to view.animate() below.
            function flyTo(waypoint) {
                if (typeof map === 'undefined') return; // safety check
                map.getView().animate({
                    center: ol.proj.fromLonLat(waypoint.center), // [lon, lat] -> map projection
                    zoom: waypoint.zoom,
                    duration: waypoint.duration
                });
            }

            var sections = document.querySelectorAll('.section');

            // Watches every .section in the scrolling text pane and fires
            // flyTo() for whichever one is currently "in focus". Each
            // section's data-step attribute (set above when the sections
            // are built) indexes into WAYPOINTS to pick the matching
            // waypoint — so data-step and WAYPOINTS must stay in sync.
            // `threshold: 0.55` + `intersectionRatio > 0.55` together mean
            // a section must cover more than 55% of the viewport before
            // it's considered active; raise/lower that number to make the
            // map trigger later/earlier while scrolling.
            var observer = new IntersectionObserver(function (entries) {
                entries.forEach(function (entry) {
                    if (entry.isIntersecting && entry.intersectionRatio > 0.55) {
                        sections.forEach(function (s) { s.classList.remove('is-active'); });
                        entry.target.classList.add('is-active');
                        var step = parseInt(entry.target.dataset.step, 10);
                        if (WAYPOINTS[step]) flyTo(WAYPOINTS[step]);
                    }
                });
            }, { threshold: [0.55] });

            sections.forEach(function (s) { observer.observe(s); });
        </script>

    </body>
</html>
